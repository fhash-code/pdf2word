name: Build EXE and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywin32 qrcode pillow requests packaging

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "PDF2Word" pdf2word.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF2Word.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}